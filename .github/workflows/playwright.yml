name: Playwright BDD tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      CI: 'true'
      BROWSER: ${{ matrix.browser }}
      WORKERS: '2'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # Public Sauce Demo practice credentials. For a client system, map repository secrets
      # to the same variable names instead of copying the example file.
      - name: Configure environment
        run: cp config/.env.example config/.env.demo

      - name: Static checks (bddgen, tsc, ESLint, Prettier)
        if: matrix.browser == 'chromium'
        run: npm run check

      - name: Run BDD scenarios
        run: npm test

      - name: Build Cucumber Spark report
        if: ${{ !cancelled() }}
        run: npm run report:spark

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.browser }}
          path: |
            reports/
            test-results/
            logs/
          retention-days: 14
